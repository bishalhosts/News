<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsline: headlines from trusted publishers</title>
  <meta name="description" content="Latest headlines from trusted news publishers in one place.">
  <link rel="preconnect" href="https://drive.usercontent.google.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top__row">
      <h1 class="brand">Newsline</h1>
      <input id="search" class="search" type="search" placeholder="Search headlines" aria-label="Search headlines" autocomplete="off">
    </div>
    <nav id="chips" class="chips" aria-label="Filter by publisher"></nav>
    <nav id="cats" class="chips chips--sub" aria-label="Filter by category" hidden></nav>
    <button id="fresh" class="fresh" type="button" hidden>New stories are available. Show them</button>
  </header>

  <p id="updated" class="updated"></p>

  <!-- Skeletons are plain HTML so they paint before JavaScript runs. -->
  <main id="news-container" class="grid" aria-busy="true" aria-live="polite">
    <div class="card card--hero skeleton" aria-hidden="true"><div class="sk sk-fill"></div></div>
    <div class="card skeleton" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line sk-short"></div></div>
    <div class="card skeleton" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line sk-short"></div></div>
    <div class="card skeleton" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line sk-short"></div></div>
    <div class="card skeleton" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line sk-short"></div></div>
  </main>
  <div class="more-wrap"><button id="more" class="more" type="button" hidden>Show more stories</button></div>

  <footer class="foot">Headlines, excerpts and images belong to their publishers. Select a story to read it on the original site.</footer>
  <noscript><p class="msg">Newsline needs JavaScript to load stories.</p></noscript>
</body>
</html>
